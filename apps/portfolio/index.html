<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tarek M. Al-Hassan - Personal Portfolio</title>
  
    <link rel="preload" as="image" href="/src/assets/pages/intro-page/my-image.webp" fetchpriority="high" />

    <!-- <link rel="preload" href="/fonts/Michroma-Regular.woff2" as="font" type="font/woff2" crossorigin /> -->
    <link
      rel="preload"
      href="/fonts/michroma-v21-latin-regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');

          var theme;
          if (stored === 'light' || stored === 'dark') theme = stored;
          else theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
          
          document.documentElement.setAttribute('theme', theme);

          if (theme === 'dark') {
            document.documentElement.style.backgroundColor = '#353535';
            document.documentElement.style.color = '#f9f8f7';
          } else {
            document.documentElement.style.backgroundColor = '#faf8f6';
            document.documentElement.style.color = '#353535';
          }

          var meta = document.querySelector('meta[name="color-scheme"]');
          if (!meta) {
            meta = document.createElement('meta');
            meta.name = 'color-scheme';
            document.head.appendChild(meta);
          }

          meta.content = theme;
        } catch (e) {
          console.warn('theme init failed', e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
